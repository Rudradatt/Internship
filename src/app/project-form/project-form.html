<section class="dashboard-container">
  <div class="top-bar">
    <h2>Dashboard</h2>
  </div>

  <div class="grid-wrapper" (mouseup)="endSelection()">
    <!-- LEFT PANEL -->
    <div class="left-panel" #leftScroll (scroll)="syncScroll('left')">
      <table class="table table-bordered resource-table">
        <thead>
          <tr>
            <th rowspan="3">Resource Name</th>
            <th rowspan="3">Project</th>
            <th rowspan="3">Role</th>
            <th rowspan="3">Designation</th>
            <th rowspan="3">Gender</th>
            <th rowspan="3">Date</th>
          </tr>
          <tr class="ghost-row"></tr>
          <tr class="ghost-row"></tr>
        </thead>

        <tbody>
          <!-- ✅ Top spacer - pushes rows down for scrolled offset -->
          <tr class="spacer-row" *ngIf="offsetY > 0" [style.height.px]="offsetY">
  <td colspan="6"></td>
</tr>

          <!-- ✅ Only visible rows rendered -->
          <tr *ngFor="let item of visibleResources; trackBy: trackByIndex">
            <td>
              <div>{{ item.name }}</div>
            </td>
            <td>
              <div>{{ item.project }}</div>
            </td>
            <td>
              <div>{{ item.role }}</div>
            </td>
            <td>
              <div>{{ item.designation }}</div>
            </td>
            <td>
              <div>{{ item.gender }}</div>
            </td>
            <td>
              <div>{{ item.date }}</div>
            </td>
          </tr>

          <!-- ✅ Bottom spacer - fills remaining scroll height -->
          <tr class="spacer-row" 
  *ngIf="totalHeight - offsetY - visibleResources.length * rowHeight > 0"
  [style.height.px]="totalHeight - offsetY - visibleResources.length * rowHeight">
  <td colspan="6"></td>
</tr>
        </tbody>
      </table>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel" #rightScroll (scroll)="syncScroll('right')">
      <table class="table table-bordered weekly-grid">
        <thead>
          <tr>
            <th *ngFor="let w of weekHeaders" colspan="5">
              <div>{{ w }}</div>
            </th>
          </tr>
          <tr>
            <ng-container *ngFor="let w of weekHeaders">
              <th *ngFor="let d of weekDays">
                <div>{{ d }}</div>
              </th>
            </ng-container>
          </tr>
          <tr>
            <th *ngFor="let date of dates">
              <div class="date-text">{{ date }}</div>
            </th>
          </tr>
        </thead>

        <tbody>
          <!-- ✅ Top spacer -->
          <tr class="spacer-row" *ngIf="offsetY > 0" [style.height.px]="offsetY">
  <td [attr.colspan]="dates.length"></td>
</tr>

          <!-- ✅ Only visible rows rendered -->
          <tr *ngFor="let user of visibleUsers; trackBy: trackByIndex">
  <td
    *ngFor="let cell of user.data; trackBy: trackByCell"
    (mousedown)="startSelection($event, user, cell)"
    (mouseenter)="onHoverSelect(user, cell)"
    (mouseup)="endSelection()"
    (dblclick)="openForm()"
    [ngClass]="{ 'bg-primary text-white': isSelected(cell) }"
    [ngStyle]="!isSelected(cell) ? getCellStyle(cell) : {}"
  >
    <div>{{ cell.value }}</div>
  </td>
</tr>

          <!-- ✅ Bottom spacer -->
          <tr class="spacer-row"
  *ngIf="totalHeight - offsetY - visibleUsers.length * rowHeight > 0"
  [style.height.px]="totalHeight - offsetY - visibleUsers.length * rowHeight">
  <td [attr.colspan]="dates.length"></td>
</tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- MODAL unchanged -->
  <div
    *ngIf="showForm"
    class="modal fade show d-block"
    tabindex="-1"
    style="background: rgba(0, 0, 0, 0.5)"
  >
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Cells</h5>
          <button class="btn-close" (click)="closeForm()"></button>
        </div>
        <div class="modal-body">
          <form [formGroup]="cellForm">
            <div class="mb-2">
              <label>First Half</label>
              <select class="form-control" formControlName="allocation1">
                <option *ngFor="let type of allocationTypes" [ngValue]="type">
                  {{ type.name }}
                </option>
              </select>
            </div>
            <div class="mb-2"><input type="checkbox" formControlName="isHalfDay" /> Half Day</div>
            <div class="mb-2" *ngIf="cellForm.value.isHalfDay">
              <label>Second Half</label>
              <select class="form-control" formControlName="allocation2">
                <option *ngFor="let type of allocationTypes" [ngValue]="type">
                  {{ type.name }}
                </option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" (click)="closeForm()">Cancel</button>
          <button class="btn btn-primary" (click)="save()">Save</button>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="showForm" class="modal-backdrop fade show"></div>
</section>
